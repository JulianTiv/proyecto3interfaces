{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
  <p class="etiqueta-superior">Acceso</p>
  <h1>Iniciar sesión</h1>

  {% include "mensajes.html" %}

  <form method="post">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" value="{{ usuario }}" required autofocus>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="boton">Iniciar sesión</button>
  </form>

  <p class="enlace-pie">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
{% endblock %}
